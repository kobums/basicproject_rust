# 개발용 DB (+ 선택: api 컨테이너). 값은 .env 에서 읽는다 (.env.example 복사).
# db/schema.sql 은 볼륨이 비어 있을 때(처음 뜰 때)만 실행된다. 다시 만들려면 docker compose down -v.
#   docker compose up -d db              DB 만 (cargo run 으로 개발할 때)
#   docker compose --profile api up -d   DB + api 이미지 빌드 / 실행
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    profiles: ["api"]
    build: .
    image: basicproject_rust:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 컨테이너 안에서는 compose 네트워크의 db 서비스로 붙는다 (.env 의 DATABASE_URL 은 쓰지 않는다).
      DATABASE_URL: ""
      DB_HOST: db
      DB_PORT: "3306"
      APP_MODE: ${APP_MODE:-production}
      PORT: "8008"
    ports:
      - "${PORT:-8008}:8008"

volumes:
  db-data:
